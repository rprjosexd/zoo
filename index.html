<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoo Interactiu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Benvingut al Zoo Interactiu!</h1>
    <p>Explora els nostres animals i canvia com es mostren!</p>
  </header>

  <main>
    <section class="zoo-grid">
      <div class="animal">
        <img src="images/1.png" alt="Animal 1">
        <h2>Pingüí</h2>
        <p>Viu al fred i neda molt bé.</p>
      </div>
      <div class="animal">
        <img src="images/2.png" alt="Animal 2">
        <h2>Lleo</h2>
        <p>Es molt peligros, i molt astut.</p>
      </div>
      <div class="animal">
        <img src="images/3.png" alt="Animal 3">
        <h2>Elefant</h2>
        <p>Te una trompa be llarga per poder fer poder beure aigua i otres coses.</p>
      </div>
      <div class="animal">
        <img src="images/4.png" alt="Animal 4">
        <h2>Tigre</h2>
        <p>El rey de la jungla.</p>
      </div>
    </section>
  </main>

  <footer>
    <button id="toggle-layout">Canvia Layout</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
